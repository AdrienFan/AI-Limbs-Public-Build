<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自我模块</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:12px;background:transparent;color:#f3f3f5;font:14px/1.4 system-ui,sans-serif}h1{font-size:16px;margin:0 0 7px;font-weight:650}.state{display:flex;align-items:center;gap:6px;margin-bottom:8px}.dot{width:8px;height:8px;border-radius:50%;background:#999;flex-shrink:0}#manage{color:#4385ff;font-weight:600;font-size:14px}@media(prefers-color-scheme:light){body{color:#171923}}
</style></head><body><h1>自我模块</h1><div class="state"><span class="dot" id="dot"></span><span id="state">读取中</span></div><div id="manage">管理 ›</div><script>
'use strict';let serial=0;const pending=new Map();window.ailsReceive=message=>{const data=JSON.parse(message),call=pending.get(data.id);if(!call)return;pending.delete(data.id);clearTimeout(call.timer);data.response.success===false?call.reject(new Error(data.response.error||'状态读取失败')):call.resolve(data.response)};
function host(method){return new Promise((resolve,reject)=>{const id='tile_'+(++serial),timer=setTimeout(()=>{pending.delete(id);reject(new Error('状态读取超时'))},10000);pending.set(id,{resolve,reject,timer});AilsTransport.postMessage(JSON.stringify({id,method,parameters:{}}))})}
function refresh(){return host('status').then(status=>{const state=status.module?.lifecycle_state;document.getElementById('state').textContent=({ACTIVE:'运行中',UPGRADING:'升级中',ROLLING_BACK:'回滚中',MIGRATING:'迁移中',SEALED:'已封存',RECOVERY_REQUIRED:'待恢复'}[state]||'未安装');document.getElementById('dot').style.background=state==='ACTIVE'?'#08ce61':state==='RECOVERY_REQUIRED'?'#ff5656':'#ffba42'}).catch(()=>{document.getElementById('state').textContent='读取失败';document.getElementById('dot').style.background='#ff5656'})}
host('__ready').then(refresh);setInterval(refresh,3000);
</script></body></html>
