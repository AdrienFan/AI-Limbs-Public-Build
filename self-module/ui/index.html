<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>空白自我模块</title>
<style>
:root{color-scheme:dark;--bg:#000;--panel:#23262f;--text:#f3f3f5;--muted:#b6bac4;--blue:#4385ff;--line:#4a4d56;--green:#08ce61}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}h1{font-size:24px;margin:0 0 8px}h2,summary{font-size:18px;font-weight:650}h2{margin:0 0 12px}.panel{background:var(--panel);border-radius:14px;padding:16px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted,small{color:var(--muted)}button,input,select,textarea{font:inherit}button{background:transparent;color:var(--blue);border:1px solid var(--line);border-radius:22px;padding:10px 16px;cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.45;cursor:default}input,select,textarea{background:#17191f;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;width:100%;margin:6px 0 12px}input[type=checkbox]{width:auto;margin:0 10px 0 0}label{display:block}.choice{padding:10px 0}.list>div{padding:8px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border:0}.badge{font-size:13px;padding:3px 8px;border-radius:8px;background:#30343e}details>summary{cursor:pointer;color:var(--blue)}details[open]>summary{margin-bottom:12px}.break{overflow-wrap:anywhere;white-space:pre-wrap}#message{white-space:pre-wrap;color:var(--blue)}[hidden]{display:none!important}#actions .row{margin-bottom:10px}#reason{min-height:90px}#receipt{min-height:110px}#permissionChoices{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}@media(min-width:760px){body{max-width:920px;margin:auto}}@media(prefers-color-scheme:light){:root{--bg:#fff;--panel:#eef0f5;--text:#171923;--muted:#58606d;--line:#c6cbd5}input,select,textarea{background:white;color:var(--text)}.badge{background:#dfe3ed}}
</style></head><body>
<h1>空白自我模块</h1><div id="moduleLine" class="row muted">正在读取模块状态…</div><p id="message" role="status" aria-live="polite"></p>
<section class="panel" id="actions"><h2>模块管理</h2><div class="row"><button id="upgrade" class="primary">升级</button><button id="rollback">回滚</button><button id="migrate">迁移</button></div><small id="actionHint">未获持续批准的操作可以在这里申请一次性批准。</small><label>回滚目标版本<select id="rollbackVersion"></select></label><label>迁移目标设备交接标识<input id="target" autocomplete="off" placeholder="从目标设备的身份与迁移信息中复制"></label></section>
<section class="panel"><h2>当前批准权限</h2><div id="grants" class="list"></div><small>一次性批准执行对应操作；限时和长期批准开放后续操作，身份、完整性和状态兼容检查仍然生效。</small></section>
<details class="panel" id="application"><summary>申请管理权限</summary>
<details id="permissionChoices"><summary id="selectionLabel">选择权限，可多选</summary><label class="choice"><input type="checkbox" value="upgrade">升级</label><label class="choice"><input type="checkbox" value="migrate">迁移</label><label class="choice"><input type="checkbox" value="rollback">回滚</label></details>
<label>申请性质<select id="mode"><option value="ONE_TIME">一次性</option><option value="TIMED">限时</option><option value="LONG">长期，至撤销</option></select></label>
<label id="durationField" hidden>申请时长，小时<input id="hours" type="number" min="1" max="8760" value="2"><small>从实际批准时开始计时，AI 可以缩短时限。</small></label>
<div id="fileField" hidden><button id="choosePackage">选择本次升级的 .ails 包</button><small id="packageLabel"></small></div>
<label>申请理由<textarea id="reason" maxlength="2000" placeholder="说明为什么需要这些管理权限"></textarea></label>
<p class="muted">每项权限独立审批。实际批准项目和时限由 AI 决定，可以部分批准、缩短时限或拒绝。</p><button id="submit" class="primary">提交申请</button>
</details>
<section class="panel" id="migration" hidden><h2>迁移交接</h2><p id="migrationHint"></p><div class="row"><button id="saveMigration">保存迁移包</button><button id="copyPrepared">复制接收凭据</button><button id="copyRelease">复制运行权交接凭据</button><button id="cancelMigration">取消迁出并恢复</button></div><div id="uploadFields"><label>ChatGPT 侧迁移登记接收地址<input id="uploadEndpoint" type="url" autocomplete="off" placeholder="https://接收服务地址/迁移登记接口"></label><label>接收服务访问令牌（如需要）<input id="uploadToken" type="password" autocomplete="off"></label><small>接收端尚未配置时可以保留迁移包；只有明确确认登记成功才卸载源端模块。</small><p id="uploadState"></p><button id="uploadMigration">上传登记并卸载源端模块</button></div><label>另一设备的接收、交接或取消凭据<textarea id="receipt"></textarea></label><div class="row"><button id="commit">交出运行权</button><button id="activate">验证交接并激活</button><button id="discard">源端取消后释放迁入槽位</button></div></section>
<details class="panel"><summary>身份与迁移信息</summary><div id="identity" class="break"></div><button id="copyDevice">复制本机交接标识</button><button id="copyAbort" hidden>复制取消迁移凭据</button></details>
<details class="panel"><summary>申请与批准记录</summary><div id="history" class="list"></div></details>
<script>
'use strict';
const $=id=>document.getElementById(id), names={upgrade:'升级',migrate:'迁移',rollback:'回滚'}, modes={ONE_TIME:'一次性',TIMED:'限时',LONG:'长期'};
const pending=new Map();let serial=0,status=null,packageToken='',exportToken='',busy=false;
window.ailsReceive=message=>{const data=JSON.parse(message),call=pending.get(data.id);if(!call)return;pending.delete(data.id);clearTimeout(call.timer);data.response.success===false?call.reject(new Error(data.response.error||data.response.error_code||'操作失败')):call.resolve(data.response)};
function host(method,parameters={}){return new Promise((resolve,reject)=>{const id='page_'+(++serial),timer=setTimeout(()=>{pending.delete(id);reject(new Error('等待时间较长，操作可能仍在宿主等待确认。请查看状态或申请记录，不要重复提交。'))},120000);pending.set(id,{resolve,reject,timer});AilsTransport.postMessage(JSON.stringify({id,method,parameters}))})}
function esc(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function say(text){$('message').textContent=text}
function grant(op){return (status?.authorizations?.effective_grants||[]).find(item=>item.operation===op)}
function selected(){return [...document.querySelectorAll('#permissionChoices input:checked')].map(item=>item.value)}
function form(){const ops=selected(),mode=$('mode').value;$('selectionLabel').textContent=ops.length?ops.map(op=>names[op]).join('、'):'选择权限，可多选';$('durationField').hidden=mode!=='TIMED';$('fileField').hidden=mode!=='ONE_TIME'||!ops.includes('upgrade');$('submit').disabled=busy||!ops.length||!$('reason').value.trim()||status?.module?.lifecycle_state!=='ACTIVE'}
function requestFor(op){for(const input of document.querySelectorAll('#permissionChoices input'))input.checked=input.value===op;$('mode').value='ONE_TIME';$('application').open=true;form();$('application').scrollIntoView({behavior:'smooth',block:'start'});$('reason').focus();say('请填写本次'+names[op]+'申请的理由。')}
function older(version,current){const a=version.split('.').map(Number),b=current.split('.').map(Number);for(let i=0;i<3;i++){if(a[i]!==b[i])return a[i]<b[i]}return false}
function render(){
 const module=status.module; if(!module){say('当前模块已离开此槽位，请返回总控台。');return}
 $('moduleLine').textContent='版本 '+module.module_version+' · '+module.lifecycle_state;
 const grants=status.authorizations.effective_grants||[];
 $('grants').innerHTML=Object.keys(names).map(op=>{const item=grants.find(g=>g.operation===op);return '<div><strong>'+names[op]+'</strong>：'+(item?(item.mode==='LONG'?'长期有效，至 AI 撤销':'限时有效至 '+esc(new Date(item.expires_at_ms).toLocaleString())):'无持续授权')+(item?.reason?'<br><small>批准理由：'+esc(item.reason)+'</small>':'')+'</div>'}).join('');
 const old=$('rollbackVersion').value,versions=(status.versions||[]).filter(v=>older(v,module.module_version));
 $('rollbackVersion').innerHTML='<option value="">'+(versions.length?'请选择旧程序版本':'无可用历史版本')+'</option>'+versions.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(versions.includes(old))$('rollbackVersion').value=old;
 const active=module.lifecycle_state==='ACTIVE';$('actions').hidden=!active; $('upgrade').disabled=busy||!active;$('rollback').disabled=busy||!active||!versions.length;$('migrate').disabled=busy||!active;$('rollbackVersion').disabled=busy||!versions.length;$('actionHint').textContent=versions.length?'未获持续批准的操作可以在这里申请一次性批准。':'无可用历史版本，暂时无法回滚；升级后会保留旧程序版本。';
 $('identity').textContent='本机交接标识：'+status.device_id+'\n身份：'+module.identity_id+'\n版本：'+module.module_version+'\n状态格式：'+module.state_schema_version+'\n生命周期：'+module.lifecycle_state+(module.migration_id?'\n迁移编号：'+module.migration_id:'');$('copyAbort').hidden=!module.abort;
 $('migration').hidden=module.lifecycle_state!=='SEALED';const outbound=module.direction==='outbound',inbound=module.direction==='inbound',committed=!!module.transfer_committed;
 $('migrationHint').textContent=outbound?(committed?'源端已交出运行权，数据仍保留；将交接凭据交给目标设备。':'源端已封存，数据仍保留；保存迁移包，等待目标设备接收凭据。'):'目标端已验证并封存，等待源端交出运行权。';
 $('saveMigration').hidden=!outbound;$('uploadFields').hidden=!outbound||committed;$('uploadState').textContent=module.saved_export?'迁移包已保存并校验，可上传登记。':'请先选择位置保存迁移包，再上传登记。';$('uploadMigration').disabled=busy||!module.saved_export||!$('uploadEndpoint').value.trim();$('copyPrepared').hidden=!inbound||!module.prepared_receipt;$('copyRelease').hidden=!outbound||!module.release;$('cancelMigration').hidden=!outbound||committed;$('commit').hidden=!outbound||committed;$('activate').hidden=!inbound;$('discard').hidden=!inbound;$('receipt').parentElement.hidden=outbound&&committed;
 for(const id of ['saveMigration','copyPrepared','copyRelease','cancelMigration','commit','activate','discard'])$(id).disabled=busy;
 $('application').hidden=!active;
 $('history').innerHTML=[...(status.requests||[])].sort((a,b)=>b.created_at_ms-a.created_at_ms).map(item=>'<div><strong>'+esc(names[item.operation]||item.operation)+' · '+esc(item.status)+'</strong><br>申请：'+esc(modes[item.requested_mode]||item.requested_mode)+(item.requested_duration_seconds?' '+esc(item.requested_duration_seconds/3600)+' 小时':'')+(item.reason?'<br>申请理由：'+esc(item.reason):'')+(item.grant?'<br>实际批准：'+esc(modes[item.grant.mode])+(item.grant.mode==='TIMED'?'，至 '+esc(new Date(item.grant.expires_at_ms).toLocaleString()):'，至撤销'):'')+(item.review_reason?'<br>审批理由：'+esc(item.review_reason):'')+(item.error?'<br>执行结果：'+esc(item.error):'')+'<br><small class="break">编号：'+esc(item.request_id)+'</small>'+(item.status==='PENDING'?'<br><button data-cancel="'+esc(item.request_id)+'" '+(busy?'disabled':'')+'>取消申请</button>':'')+'</div>').join('');
 for(const button of document.querySelectorAll('[data-cancel]'))button.onclick=()=>work(()=>host('cancel_request',{request_id:button.dataset.cancel}),'申请已取消。');form();
}
async function refresh(){status=await host('status');render()}
async function work(action,success){if(busy)return;busy=true;if(status)render();try{const result=await action();say(result.cancelled?'已取消。':success);await refresh();return result}catch(error){say(error.message)}finally{busy=false;if(status)render()}}
function parameters(op){if(op==='upgrade'){if(!packageToken)throw new Error('请选择本次升级的 .ails 包');return {}}if(op==='rollback'){const target=$('rollbackVersion').value;if(!target)throw new Error('请选择可用的旧程序版本');return {target_version:target}}const target=$('target').value.trim();if(!/^[a-f0-9]{64}$/.test(target))throw new Error('请填写目标设备的完整交接标识');return {phase:'export',target_device_id:target}}
async function operate(op,args){const continuation=op==='migrate'&&status.module.human_migration_authorized&&['commit','activate','cancel','discard'].includes(args.phase);if(grant(op)||continuation)return host('execute',{operation:op,parameters:args,...(op==='migrate'&&args.phase==='export'?{export_token:exportToken}:{})});const reason=$('reason').value.trim();if(!reason)throw new Error('请先填写申请理由');return host('submit',{mode:'ONE_TIME',reason,items:[{operation:op,parameters:args}],...(op==='migrate'&&args.phase==='export'?{export_token:exportToken}:{})})}
$('choosePackage').onclick=()=>work(async()=>{const result=await host('choose_package');if(!result.cancelled){packageToken=result.package_token;$('packageLabel').textContent=' 已选择本次操作包'}return result},'已选择 .ails 包。');
$('upgrade').onclick=()=>{if(!grant('upgrade'))return requestFor('upgrade');work(async()=>{const result=await host('choose_package');if(result.cancelled)return result;return host('execute',{operation:'upgrade',parameters:{},package_token:result.package_token})},'升级已完成。')};
$('rollback').onclick=()=>{if(!grant('rollback'))return requestFor('rollback');work(()=>operate('rollback',parameters('rollback')),'回滚已完成。')};
$('migrate').onclick=()=>{if(!grant('migrate'))return requestFor('migrate');work(async()=>{const args=parameters('migrate'),pick=await host('choose_export');if(pick.cancelled)return pick;exportToken=pick.export_token;return operate('migrate',args)},'迁移包已保存，源端已封存；请上传登记并完成交接。')};
$('submit').onclick=()=>work(async()=>{const mode=$('mode').value,ops=selected(),reason=$('reason').value.trim();if(!ops.length||!reason)throw new Error('请选择权限并填写理由');const args={mode,reason,items:ops.map(operation=>({operation,parameters:mode==='ONE_TIME'?parameters(operation):{}}))};if(mode==='TIMED'){const hours=Number($('hours').value);if(!Number.isInteger(hours)||hours<1||hours>8760)throw new Error('申请时长请输入 1～8760 小时');args.duration_seconds=hours*3600}if(mode==='ONE_TIME'&&ops.includes('upgrade'))args.package_token=packageToken;if(mode==='ONE_TIME'&&ops.includes('migrate')){const pick=await host('choose_export');if(pick.cancelled)return pick;exportToken=pick.export_token;args.export_token=exportToken}return host('submit',args)},'申请已提交，每项等待 AI 独立决定。');
$('uploadEndpoint').oninput=()=>{if(status)render()};
$('uploadMigration').onclick=()=>work(()=>host('upload_migration',{endpoint:$('uploadEndpoint').value.trim(),access_token:$('uploadToken').value}),'迁移登记已确认，源端模块已卸载，交接恢复资料已保留。');
$('saveMigration').onclick=()=>work(()=>host('save_migration'),'迁移包已保存。');
for(const [id,key] of [['copyPrepared','prepared_receipt'],['copyRelease','release'],['copyAbort','abort']])$(id).onclick=()=>work(()=>host('copy',{text:JSON.stringify(status.module[key])}),'交接凭据已复制。');
$('copyDevice').onclick=()=>work(()=>host('copy',{text:status.device_id}),'本机交接标识已复制。');
for(const [id,phase,key] of [['commit','commit','receipt'],['activate','activate','release'],['discard','discard','abort']])$(id).onclick=()=>work(()=>{const value=JSON.parse($('receipt').value);return operate('migrate',{phase,[key]:value})},'操作已处理；未获持续批准时，请等待 AI 审批。');
$('cancelMigration').onclick=()=>work(()=>operate('migrate',{phase:'cancel'}),'操作已处理；未获持续批准时，请等待 AI 审批。');
for(const input of document.querySelectorAll('#permissionChoices input'))input.onchange=form; $('mode').onchange=form;$('reason').oninput=form;
host('__ready').then(refresh).catch(error=>say(error.message));setInterval(()=>{if(!busy)refresh().catch(error=>say('状态读取失败：'+error.message))},3000);
</script></body></html>
