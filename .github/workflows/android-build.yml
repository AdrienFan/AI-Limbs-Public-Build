name: AI Limbs Bridge Children Build
on:
  workflow_dispatch:
concurrency:
  group: plugin-lab-children-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  JAVA_VERSION: '21'
jobs:
  build:
    name: Build RDC + TRIGGERcmd child extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;35.0.0"
      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build RDC + TRIGGERcmd payloads
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :rdc-extension:assembleDebug :triggercmd-extension:assembleDebug --stacktrace --no-daemon
      - name: Package two child extensions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist .child-pack
          mkdir -p dist .child-pack/rdc/payload .child-pack/triggercmd/payload
          cp plugin-lab/packages/rdc/extension.json .child-pack/rdc/extension.json
          cp plugin-lab/extensions/rdc/build/outputs/apk/debug/*.apk .child-pack/rdc/payload/extension.apk
          cp plugin-lab/packages/triggercmd/extension.json .child-pack/triggercmd/extension.json
          cp plugin-lab/extensions/triggercmd/build/outputs/apk/debug/*.apk .child-pack/triggercmd/payload/extension.apk
          (cd .child-pack/rdc && zip -qr ../../dist/rdc-provider.ailx .)
          (cd .child-pack/triggercmd && zip -qr ../../dist/triggercmd-provider.ailx .)
          unzip -l dist/rdc-provider.ailx
          unzip -l dist/triggercmd-provider.ailx
          sha256sum dist/rdc-provider.ailx dist/triggercmd-provider.ailx
      - name: Upload two child extensions
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bridge-children-v121-${{ github.run_number }}
          path: |
            dist/rdc-provider.ailx
            dist/triggercmd-provider.ailx
          if-no-files-found: error
          retention-days: 14
