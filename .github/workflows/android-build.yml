  system_environment:
    if: inputs.target == 'system-environment'
    name: Build System Environment Center v0.2.1 only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
