    if: inputs.target == 'system-environment'
    name: Build System Environment Center v0.2.12 only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build System Environment Center parent payload
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :system-environment-center-plugin:assembleDebug --stacktrace --no-daemon

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: system-environment-reports-${{ github.run_number }}
          path: |
            build/reports/**
            plugin-lab/plugins/system-environment-center/build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload system environment integration payloads
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: system-environment-center-v0.2.12-${{ github.run_number }}
          path: |
            plugin-lab/plugins/system-environment-center/build/outputs/apk/debug/*.apk
            plugin-lab/packages/system-environment-center/plugin.json
          if-no-files-found: error
          retention-days: 14


