name: AI Limbs Plugin Lab Alt Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - extension-hub
          - packager
          - developer-guide
          - ubuntu-terminal
          - rdc
          - triggercmd
          - sentinelx
          - ubuntu-system
          - system-environment
          - laner-access-manager
          - log-center
          - ui-editor
          - permission-service
          - resident-bridge

concurrency:
  group: plugin-lab-alt-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  source_inventory:
    name: Verify source and package versions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Validate all plugin and child extension versions
        run: python3 tools/plugin_lab/source_provenance.py check --output dist/source-inventory.json
      - name: Upload source inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-source-inventory-${{ github.run_number }}
          path: dist/source-inventory.json
          if-no-files-found: error
          retention-days: 14
  resident-bridge:
    needs: source_inventory
    if: inputs.target == 'resident-bridge'
    name: Build and sign Bridge receiver fixes
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: platform-tools
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;35.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build Bridge, SentinelX and RDC
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :bridge-core-plugin:assembleDebug :sentinelx-extension:assembleDebug :rdc-extension:assembleDebug --stacktrace --no-daemon
      - name: Sign installable parent and child packages
        env:
          AILIMBS_PARENT_PLUGIN_PRIVATE_PEM: ${{ secrets.AILIMBS_PARENT_PLUGIN_PRIVATE_PEM }}
          AILIMBS_CHILD_EXTENSION_PRIVATE_PEM: ${{ secrets.AILIMBS_CHILD_EXTENSION_PRIVATE_PEM }}
        run: python3 tools/plugin_lab/package_resident_bridge.py
      - name: Record Resident Bridge package sources
        run: |
          python3 tools/plugin_lab/source_provenance.py record \
            --manifest plugin-lab/packages/bridge-core/plugin.json \
            --package dist/AI-Limbs-Bridge-v1.3.10.ailp
          python3 tools/plugin_lab/source_provenance.py record \
            --manifest plugin-lab/packages/sentinelx/extension.json \
            --package dist/AI-Limbs-SentinelX-v0.1.3.ailx
          python3 tools/plugin_lab/source_provenance.py record \
            --manifest plugin-lab/packages/rdc/extension.json \
            --package dist/AI-Limbs-RDC-v1.2.8.ailx
      - name: Upload installable packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: resident-bridge-fixes-${{ github.run_number }}
          path: |
            dist/AI-Limbs-Bridge-v1.3.10.ailp
            dist/AI-Limbs-Bridge-v1.3.10.ailp.sha256
            dist/AI-Limbs-Bridge-v1.3.10.ailp.source.json
            dist/AI-Limbs-SentinelX-v0.1.3.ailx
            dist/AI-Limbs-SentinelX-v0.1.3.ailx.sha256
            dist/AI-Limbs-SentinelX-v0.1.3.ailx.source.json
            dist/AI-Limbs-RDC-v1.2.8.ailx
            dist/AI-Limbs-RDC-v1.2.8.ailx.sha256
            dist/AI-Limbs-RDC-v1.2.8.ailx.source.json
          if-no-files-found: error
          retention-days: 14
  build:
    needs: source_inventory
    if: inputs.target == 'all'
    name: Build Eight Plugin Payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build 1 - plugin-extension-hub.ailp payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :plugin-extension-hub:assembleDebug --stacktrace --no-daemon

      - name: Build 2 - bridge-core.ailp payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :bridge-core-plugin:assembleDebug --stacktrace --no-daemon



      - name: Build 3 - developer-guide.ailp payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :developer-guide-plugin:assembleDebug --stacktrace --no-daemon
      - name: Build 4 - AI Limbs Packager payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :packager-plugin:assembleDebug --stacktrace --no-daemon
      - name: Build 5 - Ubuntu Terminal plugin payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :ubuntu-terminal-plugin:assembleDebug --stacktrace --no-daemon

      # Child extensions share the same Plugin Lab SDK/Bridge contract as their parent plugins.
      # They are compiled here as payload APKs only; final .ailx signing remains in the secure local release step.
      - name: Build 6 - RDC child extension payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :rdc-extension:assembleDebug --stacktrace --no-daemon

      - name: Build 7 - TRIGGERcmd child extension payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :triggercmd-extension:assembleDebug --stacktrace --no-daemon

      - name: Build 8 - SentinelX child extension payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :sentinelx-extension:assembleDebug --stacktrace --no-daemon

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-lab-alt-reports-${{ github.run_number }}
          path: |
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload eight plugin payload APKs
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-limbs-plugin-payloads-v080-${{ github.run_number }}
          path: |
            plugin-lab/plugins/extension-hub/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/bridge-core/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/developer-guide/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/packager/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/ubuntu-terminal/build/outputs/apk/debug/*.apk
            plugin-lab/extensions/rdc/build/outputs/apk/debug/*.apk
            plugin-lab/extensions/triggercmd/build/outputs/apk/debug/*.apk
            plugin-lab/extensions/sentinelx/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

