name: AI Limbs Plugin Subject Build

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: Plugin Lab subject to compile
        required: true
        default: bridge-core
        type: choice
        options:
          - bridge-core
          - plugin-lab
          - extension-hub
          - developer-guide
          - packager
          - rdc
          - triggercmd
          - all

concurrency:
  group: plugin-lab-alt-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build selected Plugin Lab subject
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Plugin Lab app
        if: inputs.build_target == 'plugin-lab' || inputs.build_target == 'all'
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

      - name: Build Extension Hub payload
        if: inputs.build_target == 'extension-hub' || inputs.build_target == 'all'
        run: ./gradlew :plugin-extension-hub:assembleDebug --stacktrace --no-daemon

      - name: Build Bridge Core payload
        if: inputs.build_target == 'bridge-core' || inputs.build_target == 'all'
        run: ./gradlew :bridge-core-plugin:assembleDebug --stacktrace --no-daemon

      - name: Build Developer Guide payload
        if: inputs.build_target == 'developer-guide' || inputs.build_target == 'all'
        run: ./gradlew :developer-guide-plugin:assembleDebug --stacktrace --no-daemon

      - name: Build Packager payload
        if: inputs.build_target == 'packager' || inputs.build_target == 'all'
        run: ./gradlew :packager-plugin:assembleDebug --stacktrace --no-daemon

      - name: Build RDC child extension payload
        if: inputs.build_target == 'rdc' || inputs.build_target == 'all'
        run: ./gradlew :rdc-extension:assembleDebug --stacktrace --no-daemon

      - name: Build TRIGGERcmd child extension payload
        if: inputs.build_target == 'triggercmd' || inputs.build_target == 'all'
        run: ./gradlew :triggercmd-extension:assembleDebug --stacktrace --no-daemon

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-lab-alt-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload selected plugin payload APKs
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-limbs-${{ inputs.build_target }}-${{ github.run_number }}
          path: |
            plugin-lab/plugins/extension-hub/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/bridge-core/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/developer-guide/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/packager/build/outputs/apk/debug/*.apk
            plugin-lab/extensions/rdc/build/outputs/apk/debug/*.apk
            plugin-lab/extensions/triggercmd/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
