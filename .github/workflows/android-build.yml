name: AI Limbs Plugin Lab Alt Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target
        required: true
        default: all
        type: choice
        options:
          - all
          - packager
          - developer-guide
          - ubuntu-terminal
          - rdc
          - system-environment

concurrency:
  group: plugin-lab-alt-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  build:
    if: inputs.target == 'all'
    name: Build Seven Plugin Payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build 1 - plugin-extension-hub.ailp payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :plugin-extension-hub:assembleDebug --stacktrace --no-daemon

      - name: Build 2 - bridge-core.ailp payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :bridge-core-plugin:assembleDebug --stacktrace --no-daemon



      - name: Build 3 - developer-guide.ailp payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :developer-guide-plugin:assembleDebug --stacktrace --no-daemon
      - name: Build 4 - AI Limbs Packager payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :packager-plugin:assembleDebug --stacktrace --no-daemon
      - name: Build 5 - Ubuntu Terminal plugin payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :ubuntu-terminal-plugin:assembleDebug --stacktrace --no-daemon

      # Child extensions share the same Plugin Lab SDK/Bridge contract as their parent plugins.
      # They are compiled here as payload APKs only; final .ailx signing remains in the secure local release step.
      - name: Build 6 - RDC child extension payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :rdc-extension:assembleDebug --stacktrace --no-daemon

      - name: Build 7 - TRIGGERcmd child extension payload
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :triggercmd-extension:assembleDebug --stacktrace --no-daemon

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-lab-alt-reports-${{ github.run_number }}
          path: |
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload seven plugin payload APKs
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ai-limbs-plugin-payloads-v080-${{ github.run_number }}
          path: |
            plugin-lab/plugins/extension-hub/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/bridge-core/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/developer-guide/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/packager/build/outputs/apk/debug/*.apk
            plugin-lab/plugins/ubuntu-terminal/build/outputs/apk/debug/*.apk
            plugin-lab/extensions/rdc/build/outputs/apk/debug/*.apk
            plugin-lab/extensions/triggercmd/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  packager:
    if: inputs.target == 'packager'
    name: Build AI Limbs Packager v0.4.1 only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;35.0.0"
      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build Packager payload
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :packager-plugin:assembleDebug --stacktrace --no-daemon
      - name: Upload Packager payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packager-v0.4.1-${{ github.run_number }}
          path: |
            plugin-lab/plugins/packager/build/outputs/apk/debug/*.apk
            plugin-lab/packages/packager/plugin.json
          if-no-files-found: error
          retention-days: 14

  developer_guide:
    if: inputs.target == 'developer-guide'
    name: Build Developer Guide v1.5.0 only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
