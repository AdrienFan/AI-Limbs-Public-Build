          path: |
            build/reports/**
            plugin-lab/plugins/system-environment-center/build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload system environment integration payloads
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: system-environment-center-v0.2.1-${{ github.run_number }}
