name: AI Limbs Bridge Plugin Build
on:
  workflow_dispatch:
concurrency:
  group: plugin-lab-bridge-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  JAVA_VERSION: '21'
jobs:
  build:
    name: Build Bridge 1.2.1 Only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;35.0.0"
      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build Bridge 1.2.1 payload only
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :bridge-core-plugin:assembleDebug --stacktrace --no-daemon
      - name: Package Bridge 1.2.1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          root=Path('.')
          manifest=root/'plugin-lab/packages/bridge-core/plugin.json'
          data=json.loads(manifest.read_text())
          assert data['version']=='1.2.1', data['version']
          apks=sorted((root/'plugin-lab/plugins/bridge-core/build/outputs/apk/debug').glob('*.apk'))
          assert len(apks)==1, apks
          out=root/'dist/bridge-core.ailp'
          out.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.writestr('plugin.json', manifest.read_bytes())
              z.write(apks[0], 'payload/plugin.apk')
          print(out, out.stat().st_size, hashlib.sha256(out.read_bytes()).hexdigest())
          PY
          unzip -l dist/bridge-core.ailp
      - name: Upload Bridge 1.2.1
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bridge-core-v121-${{ github.run_number }}
          path: dist/bridge-core.ailp
          if-no-files-found: error
          retention-days: 14
