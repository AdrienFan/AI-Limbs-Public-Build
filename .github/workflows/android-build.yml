        with:
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;35.0.0"
      - name: Configure Android SDK
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build Developer Guide payload
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :developer-guide-plugin:assembleDebug --stacktrace --no-daemon
      - name: Upload Developer Guide payload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: developer-guide-v1.5.0-${{ github.run_number }}
          path: |
            plugin-lab/plugins/developer-guide/build/outputs/apk/debug/*.apk
            plugin-lab/packages/developer-guide/plugin.json
          if-no-files-found: error
          retention-days: 14
  ubuntu_terminal:
    if: inputs.target == 'ubuntu-terminal'
    name: Build Ubuntu Terminal v0.3.7 only
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
