name: AI Limbs Self Module Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Module version, empty uses self-module/blank.json
        required: false
        default: ''
      identity:
        description: Optional existing identity for an additional bound upgrade artifact
        required: false
        default: ''
  push:
    branches: [main, feat/visual-permission-lifecycle]
    paths:
      - 'self-module/**'
      - 'tools/package_self_module.py'
      - 'tools/check_self_module_package.py'
      - '.github/workflows/self-module-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Package fresh template and optional bound upgrade
        id: package
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_IDENTITY: ${{ inputs.identity }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, uuid
          from pathlib import Path
          version = os.environ.get('REQUESTED_VERSION') or json.loads(Path('self-module/blank.json').read_text())['module_version']
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version): raise SystemExit('Invalid module version')
          identity = os.environ.get('REQUESTED_IDENTITY', '')
          modes = [('fresh', [])]
          if identity: modes.append(('upgrade', ['--identity', str(uuid.UUID(identity))]))
          for label, extra in modes:
              target = 'self-module/artifacts/blank-self-' + label + '-' + version + '.ails'
              subprocess.run([sys.executable, 'tools/package_self_module.py', '--output', target, '--version', version] + extra, check=True)
              subprocess.run([sys.executable, 'tools/check_self_module_package.py', target, '--version', version] + extra, check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output: output.write('version=' + version + '\n')
          PY
      - name: Upload standalone artifacts and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-limbs-self-${{ steps.package.outputs.version }}-${{ github.run_number }}
          path: |
            self-module/artifacts/*.ails
            self-module/artifacts/*.report.json
          if-no-files-found: error
          retention-days: 14
