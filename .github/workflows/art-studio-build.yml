name: AI Limbs Art Studio

on:
  workflow_dispatch:
  push:
    branches:
      - feat/art-studio-v01

permissions:
  contents: read

jobs:
  art_studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Verify source and manifest versions
        run: python3 tools/plugin_lab/source_provenance.py check --output dist/source-inventory.json
      - name: Verify Art Studio capability declarations
        run: python3 tools/plugin_lab/verify_art_studio_capabilities.py
      - name: Resolve Art Studio package version
        id: art_version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("plugin-lab/packages/art-studio/plugin.json"))["version"])')"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
      - name: Install Android toolchain
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.31.0" "emulator" "system-images;android-34;google_apis;x86_64" "system-images;android-29;google_apis;x86_64"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
      - name: Test view lifecycle and capability help
        id: unit_tests
        run: |
          chmod +x ./gradlew
          ./gradlew :art-studio-plugin:testDebugUnitTest --stacktrace --no-daemon
      - name: Restore native compiler outputs
        id: native_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            plugin-lab/plugins/art-studio/.cxx
            plugin-lab/plugins/art-studio/build/intermediates/cxx
          key: ${{ runner.os }}-art-studio-ndk27-cmake331-${{ hashFiles('plugin-lab/plugins/art-studio/src/main/cpp/**', 'plugin-lab/plugins/art-studio/third_party/harfbuzz/*.tar.xz') }}
      - name: Compile plugin payload
        run: |
          chmod +x ./gradlew
          ./gradlew :art-studio-plugin:assembleDebug --stacktrace --no-daemon
      - name: Verify EXR interoperability with the independent OpenEXR reader
        run: |
          python3 -m venv /tmp/art-studio-hdr-verify
          /tmp/art-studio-hdr-verify/bin/pip install OpenEXR==3.3.5 numpy==2.2.6
          /tmp/art-studio-hdr-verify/bin/python tools/plugin_lab/verify_art_studio_hdr.py plugin-lab/plugins/art-studio/build/hdr-tests/from-kotlin.exr
      - name: Verify real Android HDR pixel pipeline
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/art-studio-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          mkdir -p dist
          for api in 29 34; do
            printf 'no\n' | avdmanager create avd --force --name art-studio-hdr --path "$ANDROID_AVD_HOME/art-studio-hdr.avd" --package "system-images;android-$api;google_apis;x86_64" --device pixel_2
            "$ANDROID_HOME/emulator/emulator" -list-avds | grep --fixed-strings --line-regexp art-studio-hdr
            "$ANDROID_HOME/emulator/emulator" -avd art-studio-hdr -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -memory 2048 > "dist/art-studio-emulator-api$api.log" 2>&1 &
            emulator_pid=$!
            trap 'if kill -0 "$emulator_pid" 2>/dev/null; then kill "$emulator_pid"; fi' EXIT
            studio_booted=0
            for attempt in $(seq 1 150); do
              if ! kill -0 "$emulator_pid" 2>/dev/null; then cat "dist/art-studio-emulator-api$api.log"; exit 1; fi
              if studio_boot_status="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" && [[ "$studio_boot_status" == 1 ]]; then studio_booted=1; break; fi
              sleep 2
            done
            if [[ "$studio_booted" != 1 ]]; then cat "dist/art-studio-emulator-api$api.log"; exit 1; fi
            ./gradlew :art-studio-plugin:connectedDebugAndroidTest --stacktrace --no-daemon
            cp -r plugin-lab/plugins/art-studio/build/reports/androidTests "dist/android-tests-api$api"
            adb emu kill
            wait "$emulator_pid"
            trap - EXIT
          done
      - name: Sign installable plugin
        env:
          AILIMBS_PARENT_PLUGIN_PRIVATE_PEM: ${{ secrets.AILIMBS_PARENT_PLUGIN_PRIVATE_PEM }}
        run: python3 tools/plugin_lab/package_art_studio.py
      - name: Record source provenance
        run: python3 tools/plugin_lab/source_provenance.py record --manifest plugin-lab/packages/art-studio/plugin.json --package dist/AI-Limbs-Art-Studio-v${{ steps.art_version.outputs.value }}.ailp
      - name: Upload plugin
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: art-studio-v${{ steps.art_version.outputs.value }}-${{ github.run_number }}
          path: |
            dist/AI-Limbs-Art-Studio-v${{ steps.art_version.outputs.value }}.ailp
            dist/AI-Limbs-Art-Studio-v${{ steps.art_version.outputs.value }}.ailp.sha256
            dist/AI-Limbs-Art-Studio-v${{ steps.art_version.outputs.value }}.ailp.source.json
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: art-studio-validation-${{ github.run_number }}
          path: |
            plugin-lab/plugins/art-studio/build/reports/tests/
            plugin-lab/plugins/art-studio/build/reports/androidTests/
            plugin-lab/plugins/art-studio/build/outputs/androidTest-results/
            plugin-lab/plugins/art-studio/build/hdr-tests/
            dist/art-studio-emulator-api*.log
            dist/android-tests-api*/
          if-no-files-found: warn
      - name: Save native compiler outputs
        if: always() && steps.native_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            plugin-lab/plugins/art-studio/.cxx
            plugin-lab/plugins/art-studio/build/intermediates/cxx
          key: ${{ runner.os }}-art-studio-ndk27-cmake331-${{ hashFiles('plugin-lab/plugins/art-studio/src/main/cpp/**', 'plugin-lab/plugins/art-studio/third_party/harfbuzz/*.tar.xz') }}
